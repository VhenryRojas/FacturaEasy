<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi Perfil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div id="app-navbar"></div>

    <div class="container">
        <h1>Mi Perfil</h1>
        <p>Actualiza tus datos personales</p>

        <div id="msgExito" class="success"></div>
        <div id="msgError" class="error"></div>

        <form id="formPerfil">
            <label style="display:block; text-align:left; margin-bottom:5px; font-weight:600; font-size: 0.9rem;">Nombre
                de usuario:</label>
            <input type="text" id="nombreUsuario" placeholder="Tu Nombre" required>
            <button type="submit" id="btnGuardar">Guardar Cambios</button>
        </form>
    </div>
    <footer class="footer">
        <p>Desarrollado por VHRojas - 2026</p>
    </footer>

    <script src="js/navbar.js"></script>
    <script src="js/perfil.js"></script>
</body>

</html>
